# Board description of the Nubia RedMagic 8 Pro / 8 Pro+ (nx729j, SM8550).
#
# Values marked [DTB] are read from Resources/DTBs/nx729j.dts in UniXNU/uefi-sheng,
# which is the device tree the stock ABL hands to the payload on this phone.
# Values marked [TODO] cannot be derived from any public source and must be
# measured on the device; scripts/collect-nx729j.py fills them in.

[board]
name = "nx729j"
soc = "SM8550"
description = "Nubia RedMagic 8 Pro / 8 Pro+"
kit = "nx729j"                     # package/ of this repository appears as kits/nx729j in the build tree

# Same target image as sheng: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
# Nothing here is device specific except where the kernel runs; the IPSW identity is
# what makes the original userland bootable, so keep product/build/board_id in sync.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The raw image written to the phone's userdata partition.
#
# [FW] first_lba is read out of the stock fastboot package for this exact model:
#   * gpt_main0.bin, partition entry 11 (label "userdata"), first_lba = 2712360
#   * rawprogram0.xml, <program label="userdata" start_sector="2712360">
#   * patch0.xml, "Update last partition 12 'userdata' with actual size in Primary
#     Header" -> last_lba = NUM_DISK_SECTORS-6
# Both files agree, and the partition is 4096-byte addressed, hence lba_bytes = 4096
# (the stock UFS LUN 0 is formatted with 4 KiB logical blocks, not 512).
#
# first_lba is therefore exact and device independent.
#
# [MEASURE] last_lba still has to come from the phone, because QUALCOMM packages
# describe "userdata" as "the rest of the disk" (num_partition_sectors="0") and do
# not record the disk size. Fill it in with, on the connected phone:
#     python tools/nx729j.py measure --write UniXNU-nx729j/board.toml
# which reads /sys/block/sda/size and stores total_sectors_in_4k - 6, exactly what
# patch0.xml asks the flash tool to write. The value is only used to check that the
# built image fits (scripts/unixnu/userdata.py: capacity = (last-first+1)*lba_bytes),
# so an unset value fails the preflight instead of writing anything wrong.
[userdata]
first_lba = 0x296328              # 2712360, 4 KiB sectors  [FW]
last_lba = 0x718bccd              # [DEVICE] 实测 2026-10-22：partition-size:userdata = 0x718BCD3000
                                  #          = 487676784640 B / 4096 = 119061715 扇区，末位 -6
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "nx729j_defconfig"
# The archive builders come from the sheng kit, which this repository is forked from.
# The SM8550 platform code (GIC, timer, PMGR/RPMh, UFS, DPU, GMU) is SoC level and is
# reused unchanged; only the identity, panel and touch inputs are device specific.
# Replace build-sheng-platform-power.py / build-native-legacy-display.py with nx729j
# variants once the panel timings are known.
# Every entry here is built on every kernel build, whether or not the selected
# defconfig links it, so the list is exactly the set the current configuration
# needs. The sheng kit's remaining archives are withheld until their qualification
# inputs exist, because they cannot be built without them:
#
#   build-native-virtio-bindings.py (both components)   needs build/storage-abi/interface-audit.json,
#       a 190-slot vtable audit of the original IOBlockStorageDevice that only a
#       live lldb snapshot stopped at _bsd_init on this phone can produce.
#   build-arm-driver.py NativeVirtioBlock / NativeRamBlock   link against that audit.
#   build-sheng-platform-power.py   needs kits/sheng/ShengPlatformPower.cpp, which no published
#       repository contains. The equivalent effect (skipping AMFI's AON latch) is a binary patch.
#   build-arm-driver.py NativeAdreno, build-native-adreno-kits.py,
#   build-native-adreno-accelerator.py, build-native-legacy-display.py
#       need an exact original GPU/framebuffer candidate.
#   build-mockfs-fixture.py   a QEMU fixture, not a device component.
#   build-boot-progress.py    needs kits/sheng/BootProgress.c, same missing kit as the power stub.
#       The kernel script only calls it when XNU_BOOT_PROGRESS=1, which requires
#       NATIVE_UFS && OWNER_ROOT_AUDIT && NATIVE_VIRTIO_BLOCK && SOURCE_CORECRYPTO14 all at once.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  # NATIVE_UFS requires NATIVE_AES, which requires the corecrypto archives above.
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  # CONFIG_XNU_SOURCE_PTHREAD=y links build/libpthread-kernel/libpthread_kernel.a.
  "build-libpthread-kernel.py",
  # IOBlockStorageDevice lives in the IOStorageFamily kext, not in XNU; NativeUfs derives
  # from it, so the class is compiled out of refer/IOStorageFamily before the link.
  "build-io-storage-family.py",
  # An observer that observes nothing, for the boot_progress_poll NativeUfs declares weak.
  "build-boot-progress-stub.py",
  # The stage-6 component under test: the native SM8550 UFS transport.
  "build-arm-driver.py NativeUfs",
  # Refusing stand-ins for the VerifiedRoot policies NativeUfs compiles against (-DNATIVE_VERIFIED_BLOCK=1).
  # This must come after NativeUfs: the script compiles the policies and merges the object into
  # build/native-ufs/libNativeUfs.a, the archive the kernel link already force-loads. Definitions placed there
  # are found by construction, because ld resolves a reference from one archive member against the other
  # members of the same archive. Passing them any other way (a standalone archive on LD_KERNEL_ARCHIVES, or
  # the bare object path) produced an undefined-symbol link even though the object and its symbol table were
  # verified correct, so this no longer depends on how the extra link inputs reach the linker at all.
  "build-verified-root-stub.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The UEFI firmware port for this phone already exists upstream, in
# UniXNU/uefi-sheng, as Platforms/ZTE/nx729jPkg. That repository is a Mu-Silicium
# tree with one package per board, so no separate uefi-nx729j repository is needed:
# clone uefi-sheng and point --uefi at it.
[firmware]
config = "nx729j"                  # Resources/Configs/nx729j.toml of the uefi-sheng checkout
dsc = "Platforms/ZTE/nx729jPkg/nx729j.dsc"
fd = "Build/nx729jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-nx729j.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/ZTE",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/ZTE",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "nx729j"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "nx729j-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel,
# its device tree (Resources/DTBs/nx729j.dtb from uefi-sheng) and the optional
# trust cache and Data seed. DarwinBoot itself lives in the firmware volume.
[payload]
volume = "NX729JESP"
size_mib = 192
loader = "firmware"
title = "nx729j first boot: source 4K XNU to console"
dram_size = "0x400000000"           # [DTB] 16 GiB: ddr-regions 0x80000000/2G + 0x880000000/6G + 0xa00000000/8G
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# The sheng- prefixed arguments are read by the sheng kit sources this repository
# reuses; they are not device names. Keep them until the kit is renamed.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "native-ufs-root=1",
  # Stage 6, first look: read-only check before anything is flashed. hostBringUp, LUN 0 GPT,
  # the "userdata" entry and its first block, then a panic that carries the result, so the
  # answer is readable on the boot page instead of needing a serial port.
  "native-ufs-probe=10",
  "sheng-pmgr=2",
  "armcpu-diagnostics=1",
  "sheng-disable-watchdogd=1",
  "sheng-lite=1",
  "boot-ui-focus3=Preferences",
  "boot-ui-focus4=SpringBoard",
  "sheng-smp=1",
  "sheng-cpufreq=3",
  "sheng-touch=4",
  "sheng-aks=1",
  "sheng-gpu-power=9",
  "sheng-gpu-metal=1",
  "sheng-fb-gpu=1",
  "sheng-banner=0",
  "sheng-gpu-perf=8",
  "sheng-gpu-addon=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "sheng-touch-hid=1",
  "sheng-data-persist=2",
  "sheng-staged-apps=1",
  "sheng-vsync=120",
]

# Fixups of signed text, applied by the kernel after signature validation; they reach
# it as /chosen/text-fixups, not on the command line. Each entry is
# <file name>,<file offset>,<original>,<replacement>, in hex. The offsets belong to
# the 21H461 shared caches, which this board uses unchanged.
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-nx729j-adt.py"
chip_id = "207"                     # [DTB] qcom,msm-id 0x207 (SM8550-AB); same value sheng uses
owned_memory_size = "0x130000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # [DTB] /cpus reg 0x00..0x700
packed_data_ramdisk = true
persistent_data = true
ipad_identity = true
unique_chip_id = "required"         # the platform seed is not stored in any repository

# No [[bootimg.dtb_node]] here, unlike sheng.
#
# [DTB] nx729j.dts already carries /reserved-memory/splash_region
# (label cont_splash_region, reg 0x0 0xb8000000 0x0 0x2b00000), so the stock ABL
# finds the region it expects and does not power the panel off. Adding a second node
# with the same path would collide. Verify after the first boot that the panel stays
# on; if it does not, re-check the region in the DTB before adding anything here.
