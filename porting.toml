status = "device-verified"
components = []
paths = ["drivers/NativeUfs/**", "configs/nx729j_stage7_defconfig", "scripts/build-userdata-root-image.py", "seeds/data-seed.dbr"]
inputs = ["UFS LUN0 GPT, LUN4 boot_a and the userdata partition starting at LBA 2712360.", "OS window at offset 0x100000 (6,077,580,800 bytes), SystemOS window at 0x16A600000 (3,303,014,400 bytes) inside the userdata image.", "Official skip-setup Data seed, 540,816 bytes, sha256 8f88eac83c7e7d3bf1414b8b002e04fbdc5dcf26c9a34d7221e5b4b152398e."]
configuration = ["The SHLOG window lives in the last 32 MiB of userdata, first LBA 121765883, version 5 header with msg_mode=1 and 8192 log blocks.", "sheng-log=1 opens the window; the driver refuses to open it while the root layout is invalid, so a failed mount leaves no log.", "sheng-data-persist=2 keeps the Data store across boots; the overlay header carries the seed digest and rebuilds when the seed changes."]
procedure = ["Pack the boot image with the Data seed in Payloads/scratch-data.img, flash boot_a only, then reset with --power=reset,1.", "After the run, enter 9008 and read the window with python tools/host/edl-read-log.py --port 11 --scan --slots.", "Decode the slots and the header with scripts/read-sheng-log.py to get boot_id, uptime_s, rounds and the per-round phase."]
findings = ["The UFS stack is sound. The APFS root mounts, the Data volume mounts and the official skip-setup seed removed the container failures entirely: Too many corpses went from 93 to 0, deny(1) from 68 to 0, SpringBoard from 34 to 0 on boot 0x267a1232.", "The single largest measured improvement in the port came from replacing the hand-built Data seed with the official one; the image content changed by 221,200 bytes and nothing else did.", "A rejected manifest still needs a window to report itself. The GPT geometry is now used to open the window temporarily so a manifest rejection is readable instead of silent.", "The op 0x28 codes in the transfer log are SCSI READ(10) with direction 2 to host, not copy-up writes. A 2.36 GB read stream in boot 0x1f44cebb was originally read as a write storm; the same stream appears with union disabled, so it is dyld pulling the shared cache."]
completion = ["Root, Data and preboot are all reachable, the window opens on every boot and the per-round heartbeat advances without write errors."]
limits = ["/private/preboot/Cryptexes and /private/preboot/Cryptexes/OS both return ENOENT (err=2) on this device, so the sealed-root cryptex pair does not exist yet.", "storage-probe and log=1 checkpoint recording described by the debugging guide are not implemented in this kernel; the binary contains zero occurrences of storage-probe."]
next_action = ["Decide the cache path that every process may read: either allow the preboot cache path in the sandbox profile, or finish the union composition so /System/Library/Caches/com.apple.dyld resolves for pid 1 first."]

