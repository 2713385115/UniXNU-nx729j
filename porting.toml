[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["scripts/build-uefi-sheng.sh", "scripts/import-sheng-uefi.py", "scripts/make-nx729j-adt.py", "tools/nx729j-DarwinBoot-diag.c", "unixnu.lock"]
inputs = ["Stock ABL is EDK2 QcomModulePkg and hands an nx729j device tree to the payload.", "uefi-sheng imported as the firmware source, pinned in unixnu.lock.", "boot_a is 0x6000000 bytes on slot a; the packed image is 81,309,696 bytes."]
configuration = ["The boot image is a 4096-byte header plus gzip(loader + FAT volume + dtb). The inflated payload is 204,476,416 bytes.", "Diagnostic markers are drawn by DarwinBoot Entry.S and by the entry probes; the green bar is painted before br x1, so its presence says nothing about kernel progress.", "The ADT keeps a 64-entry outside-window exclusion table and the owned memory window used by the kernel."]
procedure = ["Build or import the UEFI image, build the payload from board.toml, then pack the boot image with the loader, the payload FAT and the dtb.", "Flash with tools/host/edl-flash-boot.py out/<image>.img --port <COM> against LUN4 boot_a and reset with --power=reset,1.", "Verify the write with tools/host/edl-verify-boot.py, which reads boot_a back and compares sha256 block by block."]
findings = ["A boot that ends without any SHLOG content is not proof that the kernel never reached storage: the v5 writer only opens its window when the root layout is valid. The failure path now records rootFailureRecord into the last slot so a rejected mount still leaves a readable reason.", "Sahara can answer before firehose is up. When the flasher reports that the target is speaking SAHARA protocol, run it once without --no-loader; when it reports a protocol error after the loader, retry with --no-loader.", "The framebuffer console and the SHLOG channel are independent. Every conclusion in this record comes from SHLOG read over 9008, never from a photograph of the screen."]
completion = ["The image enters UniXNU, publishes the framebuffer, hand off to DarwinBoot and reaches the kernel entry without a panic."]
limits = ["Stage 7 firmware enrolment is not started. The payload boot-progress layer is the only progress channel on the device side."]
next_action = ["Keep the entry-probe images available as the fallback for any kernel that stops before the SHLOG window opens."]

