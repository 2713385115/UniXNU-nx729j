[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["drivers/NativeUfs/RootLayout.h", "scripts/build-owner-verified-block.py", "scripts/build-verified-root-bundle.py"]
inputs = ["16 GiB DRAM in two banks, a fixed ADT owned window and a reserved panic region.", "The owned window is published through the ADT and excluded ranges."]
configuration = ["memory-outside and the owned window size come from board.toml and the ADT generator.", "The kernel panic log is kept in a reserved DRAM region, not on the screen, so a panic is only readable if something copies it out."]
procedure = ["Pack the ADT with the owned window, boot, then read the panic region and the failure slot over 9008.", "Use the header fields of the SHLOG window to tell a stalled writer from a missing window."]
findings = ["The panic region is memory-backed. Firehose cannot peek at arbitrary DRAM, so a panic that is not written to UFS is unreachable; the failure record in the last window slot exists for exactly that case.", "The window header state field is a constant written by the driver and carries no information about which Data store was resumed."]
completion = ["The owned window matches the ADT, the kernel survives the memory hand-off and the panic region stays empty on a healthy boot."]
limits = ["No dump of a userspace-era panic has been captured yet, so the reset cause after 30 s of userspace is still unattributed."]
next_action = ["Add a reset-cause record written to UFS during the last publishing round so a watchdog or PMIC reset leaves a trace."]

