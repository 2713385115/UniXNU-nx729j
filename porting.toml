inputs = ["32 MiB SHLOG window with a 512-byte version 5 header and 8192 log blocks.", "9008 firehose access for reads; there is no serial console on this device."]
configuration = ["sheng-log=1 opens the window, boot-progress=2 selects the progress layer and sheng-build-tag names the build in the header.", "The header carries boot_id, uptime_s, rounds, slots_written, write_errors, msg_mode and a phase/phase_round pair; the phase is a property of the log writer, not of the official boot stage."]
procedure = ["Enter 9008, then read the whole window with python tools/host/edl-read-log.py --port 11 --scan --slots; the tool writes log-window.bin, msgbuf.txt, slots.bin, panic.bin, failure.bin and phase.bin.", "Compare the boot_id against the previous run before reading anything else: a stale window means the boot never happened.", "Decode the slots with scripts/read-sheng-log.py --decode to get a per-round timeline."]
findings = ["A zero log is the most misread signal in this project. Before the failure record existed, a rejected root left the window all zeroes and the driver looked broken; the fix was to write rootDiagnosticFailure into the last slot on every failure path.", "The header uptime is the uptime at the last publish, not the time the device died. Boot 0x12c714bd reports 490 s in the header while the window runs to 496.5 s, and the 39-minute boot reports 2354 s while its window runs to 2388.4 s.", "The message buffer is a ring. A long run overwrites its own early lines, so an early-phase count of zero is not evidence that nothing happened; only slot snapshots and the header survive a full lap.", "Per-round lines of the form NativeUfs: log round N t=<seconds> ok <n> errs <n> are the cheapest liveness signal: the round that never prints is the round that stalled."]
completion = ["Every boot yields a boot_id, a header, a decodable msgbuf and a per-round timeline, and a failure of any kind leaves a readable reason in UFS."]
limits = ["The official storage-probe and log=1 checkpoint recording described by the debugging guide is not implemented, so official criterion four has no data source on this device yet.", "The checkpoint export helper that the guide mentions by name does not exist in this fork of the reader."]
next_action = ["Implement the PID 1 checkpoint ring behind storage-probe=1 in the driver, then export it as the guide expects so criterion four becomes measurable."]

