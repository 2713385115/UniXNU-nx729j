schema_version = 1

[device]
name = "nx729j"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Nubia RedMagic 8 Pro / 8 Pro+ (SM8550). Bring-up reaches official Stage 7 userspace: launchd starts from the APFS root, the Data volume mounts and the system stays up for 39 minutes with zero process crashes on the best measured build, but no display service produces output yet. This record carries the measured boot ledger, the confirmed root causes and the open Stage 7 criteria."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "unixnu.lock", "configs/**", "proprietary-files.txt"]
inputs = ["SM8550-AB with msm-id 0x207, 16 GiB DRAM and 512 GiB UFS.", "iPadOS 17.7.11 (21H461) selected as board.os_profile.", "Panel, touch and firmware data taken from the stock device tree and the stock flash package."]
configuration = ["board.toml declares board.name = nx729j, board.soc = SM8550 and board.os_profile = ipados-17.7.11-21H461. The file is still the format 1 layout: no schema_version and no [components] table.", "configs/nx729j_stage7_defconfig is the Stage 7 first-look configuration. It carries CONFIG_XNU_SHENG_PMGR=y and the cache-carrier switches documented in the storage area.", "The kernel is built only on the macOS runner of 2713385115/UniXNU. This host has neither clang nor a hypervisor, so every kernel change ships as a CI artifact."]
procedure = ["Read https://unixnu.com/zh/porting/steps and https://unixnu.com/zh/porting/bring-up before touching a configuration.", "Dispatch a build with python tools/host/ci-dispatch.py --defconfig nx729j_stage7_defconfig --steps kernel --device-repo 2713385115/UniXNU-nx729j --device-ref main.", "Fetch the artifact with tools/host/ci-fetch-parallel.py --block 4 --workers 12 and pack a boot image that changes one FAT member only."]
findings = ["A single-variable image is the only usable diagnosis. A helper walks the payload FAT, hashes every member and asserts that only EFI/UniXNU/unixnu.toml differs from the previous image.", "The payload caps the argument string at 1000 bytes. The official 45-entry set with sheng-log=1 occupies 990 bytes, so a new diagnostic must replace an existing entry rather than append one.", "Adding a parameter that the kernel does not parse is invisible: build-tag is implemented as sheng-build-tag in BootProgress.c, so build-tag=s7p7 was silently ignored until the kernel strings were counted."]
completion = ["Every pin resolves, the defconfig builds on the official macOS workflow, and the packed boot image passes the per-member hash comparison."]
limits = ["board.toml is still format 1. This record passes scripts/porting-record.py check, but the directory workflow only adopts it once board.toml moves to schema_version 2 with a [components] selection and a components.toml feed."]
next_action = ["Migrate board.toml to schema_version 2 and add the component selection so this record becomes the published device page."]

